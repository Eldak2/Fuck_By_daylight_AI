<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вадим — AI Ассистент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-bottom: 2px solid #ff6b81;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .status {
            font-size: 13px;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f0f23;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: #fff;
            border-bottom-right-radius: 4px;
            margin-left: 20px;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 107, 129, 0.1);
            margin-right: 20px;
        }

        .message.bot .label {
            font-size: 11px;
            color: #ff6b81;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .typing {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 107, 129, 0.08);
            display: none;
            gap: 4px;
            margin-right: 20px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #ff6b81;
            border-radius: 50%;
            animation: typingBounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .input-area {
            padding: 12px 16px 20px;
            background: #1a1a2e;
            border-top: 1px solid rgba(255, 107, 129, 0.1);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(255, 107, 129, 0.2);
            border-radius: 25px;
            background: #0f0f23;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        .input-area input:focus {
            border-color: #ff6b81;
        }

        .input-area input::placeholder {
            color: #556;
        }

        .input-area .btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: #0a0a1a;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .input-area .btn:active {
            transform: scale(0.92);
        }

        .input-area .btn:disabled {
            opacity: 0.4;
            transform: scale(0.95);
        }

        .input-area .mic-btn {
            background: none;
            border: 2px solid rgba(255, 107, 129, 0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: #8899aa;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .input-area .mic-btn.listening {
            border-color: #00ff88;
            color: #00ff88;
            animation: pulse-mic 1s infinite;
        }

        @keyframes pulse-mic {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.2); }
            50% { box-shadow: 0 0 20px 4px rgba(0,255,136,0.05); }
        }

        .status-bar {
            padding: 6px 16px;
            background: #0a0a1a;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #556;
            border-top: 1px solid rgba(255,255,255,0.03);
            flex-shrink: 0;
        }

        .status-bar .api-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-bar .api-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-bar .api-status .dot.online {
            background: #00ff88;
        }

        .status-bar .api-status .dot.offline {
            background: #ff4757;
        }

        .quick-commands {
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            background: #12122a;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255,255,255,0.03);
            flex-shrink: 0;
        }

        .quick-commands button {
            padding: 6px 12px;
            border: 1px solid rgba(255, 107, 129, 0.15);
            border-radius: 16px;
            background: transparent;
            color: #8899aa;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .quick-commands button:active {
            background: rgba(255, 107, 129, 0.1);
            color: #ff6b81;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 17px; }
            .message { font-size: 14px; padding: 10px 14px; }
            .input-area input { font-size: 14px; padding: 10px 14px; }
            .input-area .btn, .input-area .mic-btn { width: 44px; height: 44px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>💬 Вадим</h1>
        <div class="status">
            <span class="dot"></span>
            <span id="statusText">Онлайн</span>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">
            <div class="label">⚡ Вадим</div>
            Привет! Я твой AI-напарник. Напиши или скажи команду.
        </div>
    </div>

    <div class="typing" id="typingIndicator">
        <span></span><span></span><span></span>
        <span style="font-size:12px;color:#667;margin-left:6px;">Вадим думает...</span>
    </div>

    <div class="quick-commands">
        <button onclick="sendQuick('открой стим')">🎮 Steam</button>
        <button onclick="sendQuick('открой chrome')">🌐 Chrome</button>
        <button onclick="sendQuick('погода Москва')">🌤️ Погода</button>
        <button onclick="sendQuick('сделай скриншот')">📸 Скрин</button>
        <button onclick="sendQuick('режим 1')">🎮 Запись</button>
        <button onclick="sendQuick('режим 5')">🔥 Свободный</button>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Напишите сообщение..." />
        <button class="mic-btn" id="micBtn" title="Голосовой ввод">🎤</button>
        <button class="btn" id="sendBtn">➤</button>
    </div>

    <div class="status-bar">
        <span id="connectionStatus">🔗 Подключение...</span>
        <span id="apiStatus" class="api-status">
            <span class="dot offline" id="apiDot"></span>
            <span id="apiLabel">API</span>
        </span>
    </div>

    <script>
        // ===== КОНФИГ =====
        // Если запускаешь с телефона — замени IP на адрес своего ПК
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://127.0.0.1:5000'
            : 'http://' + window.location.hostname + ':5000';

        // ===== DOM =====
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusText = document.getElementById('statusText');
        const connectionStatus = document.getElementById('connectionStatus');
        const apiDot = document.getElementById('apiDot');
        const apiLabel = document.getElementById('apiLabel');

        let isListening = false;
        let recognition = null;
        let isProcessing = false;

        // ===== ИНИЦИАЛИЗАЦИЯ ГОЛОСА =====
        function initVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                micBtn.style.opacity = '0.4';
                micBtn.title = 'Голосовой ввод не поддерживается';
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.textContent = '🔴';
            };

            recognition.onerror = (event) => {
                console.warn('Voice error:', event.error);
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
                if (event.error === 'not-allowed') {
                    addMessage('bot', '⚠️ Разрешите доступ к микрофону в браузере.');
                }
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        messageInput.value = transcript;
                        sendMessage();
                    }
                }
            };
        }

        // ===== ДОБАВИТЬ СООБЩЕНИЕ =====
        function addMessage(sender, text) {
            typingIndicator.style.display = 'none';
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            if (sender === 'bot') {
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = '⚡ Вадим';
                div.appendChild(label);
                const textNode = document.createTextNode(text);
                div.appendChild(textNode);
            } else {
                div.textContent = text;
            }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ===== ОТПРАВКА СООБЩЕНИЯ =====
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isProcessing) return;
            messageInput.value = '';
            addMessage('user', text);
            isProcessing = true;
            sendBtn.disabled = true;
            typingIndicator.style.display = 'flex';

            try {
                const resp = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await resp.json();
                typingIndicator.style.display = 'none';
                if (data.response) {
                    addMessage('bot', data.response);
                } else if (data.error) {
                    addMessage('bot', '❌ ' + data.error);
                } else {
                    addMessage('bot', '❌ Неизвестный ответ от сервера');
                }
            } catch (err) {
                typingIndicator.style.display = 'none';
                addMessage('bot', '❌ Ошибка соединения с API. Проверьте, запущен ли сервер.');
                console.error(err);
            }
            isProcessing = false;
            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ===== БЫСТРЫЕ КОМАНДЫ =====
        function sendQuick(text) {
            messageInput.value = text;
            sendMessage();
        }

        // ===== ПРОВЕРКА API =====
        async function checkApi() {
            try {
                const resp = await fetch(`${API_URL}/status`, { timeout: 3000 });
                if (resp.ok) {
                    connectionStatus.textContent = '✅ Соединение';
                    apiDot.className = 'dot online';
                    apiLabel.textContent = 'API ✅';
                    return true;
                }
            } catch (e) {
                // игнорируем
            }
            connectionStatus.textContent = '⚠️ Нет соединения';
            apiDot.className = 'dot offline';
            apiLabel.textContent = 'API ⚠️';
            return false;
        }

        // ===== СОБЫТИЯ =====
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        micBtn.addEventListener('click', () => {
            if (!recognition) {
                addMessage('bot', '⚠️ Голосовой ввод не поддерживается в этом браузере.');
                return;
            }
            if (isListening) {
                recognition.stop();
                return;
            }
            try {
                recognition.start();
            } catch (e) {
                // уже запущен
            }
        });

        // ===== ПРОВЕРКА API ПРИ СТАРТЕ =====
        async function init() {
            initVoice();
            await checkApi();
            setInterval(checkApi, 15000);
            // Приветствие
            setTimeout(() => {
                addMessage('bot', '✅ Соединение установлено. Я готов!');
            }, 500);
        }

        init();
    </script>
</body>
</html>
